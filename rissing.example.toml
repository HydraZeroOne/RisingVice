# Copy to `Rissing.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# RISSING_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: RISSING_GAME_DIR
game_dir = 'D:\Rissing-data\game'

# Derived data. Default: %LOCALAPPDATA%\Rissing\cache.   env: RISSING_CACHE_DIR
# cache_dir = 'D:\Rissing-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\Rissing\data.   env: RISSING_DATA_DIR
# data_dir = 'D:\Rissing-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: RISSING_TEST_TITLES (separated by ';')
test_titles = []
